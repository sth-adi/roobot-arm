
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Robot Arm Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 24px 16px;
        }

        main {
            max-width: 550px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .panel {
            background: white;
            padding: 22px;
            margin: 18px 0;
            border-radius: 14px;
            box-shadow: 0 3px 12px #0001;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 12px 0;
        }

        button {
            width: 100%;
            padding: 20px 12px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .collect { background: #2563eb; }
        .return { background: #15803d; }
        .TypedCommandButton { background:#64748b}
        .home { background: #475569; }
        .stop { background: #dc2626; }
        .refresh { background:#1e293b; }

        #message {
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .muted {
            color: #64748b;
            font-size: 14px;
        }

        .KeyDropdown {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
        }
        

        #confirmRow button { margin-right: 8px; }
        #job { font-weight: 600; margin: 8px 0 0; }
        #job.failed { color: #dc2626; }
        #job.done { color: #15803d; }
        .confirm-yes { background: #15803d; }
        .confirm-no { background: #64748b; }

        #commandInput {
            width: 90%;
            height: 100px;
            margin: 0 auto;
            display: block;
        }
    </style>
</head>

<body>
<main>
    <h1>Robot Arm Control</h1>

    <section class="panel">
        <h2>Connection</h2>

        <div class="status-row">
            <span>Server</span>
            <strong id="connection">Checking...</strong>
        </div>

        <div class="status-row">
            <span>Operating mode</span>
            <strong id="mode">Unknown</strong>
        </div>

        <div class="status-row">
            <span>Arm status</span>
            <strong id="armStatus">Loading...</strong>
        </div>

        <button class="refresh" onclick="refreshAll()">
            Refresh Status
        </button>
    </section>

    <section class="panel" id="TypedCommandPanel">
        <h2>Typed Command</h2>

        <label for="commandInput">Enter your command for our ai assistant:</label>

        <input type="text" id="commandInput" placeholder="e.g. get me the second key" maxlength="500">

        <button
            class="TypedCommandButton"
            onclick="sendTypedCommand()">
            Send Command
        </button>

        <!-- Shown when the assistant asks "Fetch key 2?" -->
        <div id="confirmRow" hidden>
            <button class="confirm-yes" onclick="answerConfirm(true)">Yes</button>
            <button class="confirm-no" onclick="answerConfirm(false)">No</button>
        </div>

        <p id="job" role="status" aria-live="polite">No job yet.</p>
    </section>

    <section class="panel" id="KeyRequestPanel">
        <h2>Request Key</h2>

        <label for="KeySelect">Choose a key:</label>

        <select name="KeySelect" id="KeySelect" class="KeyDropdown">
            <option value="" disabled>Loading...</option>
        </select>

        <button
            class="collect"
            onclick="CollectKey()">
            Request Key
        </button>
    </section>

    <section class="panel" id="KeyReturnPanel">
        <h2>Return Key</h2>

        <label for="KeyReturn">Choose a key:</label>

        <select name="KeyReturn" id="KeyReturn" class="KeyDropdown">
            <option value="" disabled>Loading...</option>
        </select>

        <button
            class="return"
            onclick="ReturnKey()">
            Return Key
        </button>
    </section>

    <section class="panel" id="StopPanel">
        <h2>Emergency</h2>

        <!-- Always works, even while the arm is busy. -->
        <button class="stop" id="stopButton" onclick="stopArm()">
            STOP
        </button>
    </section>

    <p id="message" role="status" aria-live="polite">
        Ready to connect.
    </p>


</main>

<script>
    // ===== The arm's front door (server.py, routes under /arm/) =====================================
    // Buttons and typed/spoken words BOTH go through this block, to the same door - only typed words ever reach
    // the AI (a button already names its action, so it skips straight to doing it). The message shapes are
    // PLACEHOLDERS (see dashboard/contract.py in the repository): if they change, change this block only.
    //   POST /arm/request {v, id, text}            typed words: the assistant chooses what to do
    //   POST /arm/request {v, id, action, key}     a button: action is "fetch", "return", "home" or "stop" (no AI call)
    //   POST /arm/request {confirm: token}         yes to "Fetch key 2?"   ({cancel: token} is no)
    //   GET  /arm/job                              progress: {status, step, of, message, error}
    let pendingToken = null;

    async function armPost(body) {
        const response = await fetch("/arm/request", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign({ v: 1, id: "page" + Date.now() }, body))
        });
        let data = null;
        try { data = await response.json(); } catch (e) { /* no JSON body */ }
        if (response.status === 503) {
            return { kind: "error", message: "The arm's front door is not running on the server." };
        }
        return data || { kind: "error", message: "The server answered HTTP " + response.status + "." };
    }

    // Show what the assistant said, and the Yes / No buttons when it wants a confirmation.
    function showReply(reply) {
        const message = document.getElementById("message");
        message.textContent = reply.message || "No answer.";
        message.style.color = reply.kind === "error" ? "#dc2626" : "";
        pendingToken = reply.kind === "confirm" ? reply.token : null;
        document.getElementById("confirmRow").hidden = pendingToken === null;
    }

    async function armSend(body) {
        try {
            showReply(await armPost(body));
        } catch (error) {
            showReply({ kind: "error", message: "Could not reach the server: " + error.message });
        }
    }

    async function sendTypedCommand() {
        const input = document.getElementById("commandInput");
        const text = input.value.trim();

        if (!text) {
            showReply({ kind: "error", message: "Type a command first." });
            return;
        }

        await armSend({ text: text });
        input.value = "";
    }

    function answerConfirm(yes) {
        if (pendingToken === null) { return; }
        armSend(yes ? { confirm: pendingToken } : { cancel: pendingToken });
    }

    // The Request Key / Return Key buttons: the number (1, 2 or 3) chosen in the dropdown is the action's key.
    // These are buttons, not typed text, so they never go near the AI - they dispatch straight away.
    function CollectKey() {
        const select = document.getElementById("KeySelect");
        if (!select.value) { showReply({ kind: "error", message: "No key is currently available to fetch." }); return; }
        armSend({ action: "fetch", key: Number(select.value) });
    }

    function ReturnKey() {
        const select = document.getElementById("KeyReturn");
        if (!select.value) { showReply({ kind: "error", message: "No key is currently out to return." }); return; }
        armSend({ action: "return", key: Number(select.value) });
    }

    // ===== Keeping the two dropdowns honest =====================================================
    // GET /arm/state reports where each key is believed to be ({"1":"box","2":"tray","3":"unknown"}, from
    // dashboard/boxes.Store, persisted and survives a restart). "Request Key" only ever offers keys that are
    // in their box (fetchable); "Return Key" only ever offers keys that are NOT in their box (out, so
    // returnable). Rebuilt only when the key state actually changes, so an open dropdown doesn't jump around.
    let lastKeyState = null;

    function fillKeyDropdown(select, keyNumbers, emptyLabel) {
        const current = select.value;
        select.innerHTML = "";
        if (keyNumbers.length === 0) {
            const opt = document.createElement("option");
            opt.value = "";
            opt.textContent = emptyLabel || "None available";
            opt.disabled = true;
            select.appendChild(opt);
            return;
        }
        for (const k of keyNumbers) {
            const opt = document.createElement("option");
            opt.value = k;
            opt.textContent = "Key " + k;
            select.appendChild(opt);
        }
        if (keyNumbers.includes(current)) { select.value = current; }
    }

    function sameKeyState(a, b) {
        if (!a || !b) { return false; }
        const ak = Object.keys(a), bk = Object.keys(b);
        return ak.length === bk.length && ak.every(k => a[k] === b[k]);
    }

    async function refreshKeyDropdowns() {
        let keys = {};
        let reachable = true;
        try {
            const response = await fetch("/arm/state");
            reachable = response.status !== 503;
            if (response.ok) { keys = (await response.json()).keys || {}; }
        } catch (error) {
            reachable = false;
        }
        if (reachable && sameKeyState(keys, lastKeyState)) { return; }      // nothing changed, don't disturb an open dropdown
        lastKeyState = reachable ? keys : null;                            // force a re-check once the front door comes back
        const numbers = Object.keys(keys).sort();
        const emptyLabel = reachable ? "None available" : "Front door offline";
        fillKeyDropdown(document.getElementById("KeySelect"), numbers.filter(k => keys[k] === "box"), emptyLabel);
        fillKeyDropdown(document.getElementById("KeyReturn"), numbers.filter(k => keys[k] !== "box"), emptyLabel);
    }

    function stopArm() {
        armSend({ action: "stop" });
    }

    // Progress of the latest job, every second.
    async function pollJob() {
        const line = document.getElementById("job");

        try {
            const response = await fetch("/arm/job");

            if (response.status === 404) {
                line.textContent = "No job yet.";
                line.className = "";
                return;
            }

            if (!response.ok) { throw new Error("HTTP " + response.status); }

            const job = await response.json();
            const steps = job.of ? " (step " + job.step + " of " + job.of + ")" : "";

            line.textContent = job.status + steps + (job.message ? ": " + job.message : "");
            line.className = job.status === "failed" ? "failed" : job.status === "done" ? "done" : "";
        } catch (error) {
            line.textContent = "Job status unavailable.";
            line.className = "";
        }
    }

    document.getElementById("commandInput").addEventListener("keydown", function (event) {
        if (event.key === "Enter") { sendTypedCommand(); }
    });

    pollJob();
    setInterval(pollJob, 1000);
    refreshKeyDropdowns();
    setInterval(refreshKeyDropdowns, 2000);
    // ===== end of the arm's front door ================================================================

    // Send a JSON command to the Python server.
    async function sendCommand(command) {
        const message = document.getElementById("message");

        // Prevent overlapping command submissions.
        const buttons = document.querySelectorAll(
            ".panel button:not(.refresh)"
        );

        buttons.forEach(button => button.disabled = true);
        message.textContent = "Sending command: " + command + "...";

        try {
            const response = await fetch("/controller", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    command: command
                })
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            message.textContent =
                "Command accepted by server: " + command;
        } catch (error) {
            message.textContent =
                "Failed to send command: " + error.message;
        } finally {
            buttons.forEach(button => button.disabled = false);
        }
    }

    // Read the arm status from GET /status.
    async function refreshStatus() {
        const statusElement = document.getElementById("armStatus");

        try {
            const response = await fetch("/status");

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const status = await response.text();

            statusElement.textContent = status || "No status reported";
        } catch (error) {
            statusElement.textContent = "Unavailable";
        }
    }

    // Read the operating mode from GET /mode.
    async function refreshMode() {
        const modeElement = document.getElementById("mode");

        try {
            const response = await fetch("/mode");

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            modeElement.textContent =
                response.headers.get("Mode") || "Unknown";
        } catch (error) {
            modeElement.textContent = "Unavailable";
        }
    }

    // Test whether the server responds.
    async function checkConnection() {
        const connectionElement =
            document.getElementById("connection");

        try {
            const response = await fetch("/controller");

            // Does not report as Offline if the server goes down and refresh status is pressed. Needs fixing.
            if (response.status == 404) {
                throw new Error("HTTP " + response.status);
            }

            // Ensure the returned controller data is valid JSON.
            await response.json();

            connectionElement.textContent = "Online";
            connectionElement.style.color = "#15803d";
        } catch (error) {
            connectionElement.textContent = "Offline";
            connectionElement.style.color = "#dc2626";
        }
    }

    async function refreshAll() {
        await Promise.all([
            checkConnection(),
            refreshStatus(),
            refreshMode()
        ]);
    }

    // Update the displayed information every two seconds.
    refreshAll();
    setInterval(refreshAll, 2000);
</script>
</body>
</html>
